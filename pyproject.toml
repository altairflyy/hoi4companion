[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.12,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi4companion"
version = "0.2.0"
description = "Open source National Focus Explorer for Hearts of Iron IV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.3,<13", "yt-dlp[default]>=2026.3.17", "imageio-ffmpeg>=0.6,<1"]
license = "MIT"

[project.optional-dependencies]
overlay = ["opencv-python-headless>=4.10,<6"]

[project.scripts]
hoi4companion = "hoi4companion.__main__:main"

[tool.setuptools.package-data]
"hoi4companion" = ["web/*.html", "web/*.css", "web/*.js", "web/*.d.ts", "guides/*.json", "guide-import-prompt.md", "guide_language.json", "*-profile-v1.json", "country-functions-v1.json", "live-profiles-v1.json", "translations.json", "authoring-actions-v1.json", "foreign-tasks-v1.json", "examples/*.txt", "examples/*.json", "licenses/*.txt", "rules/cwtools/**/*", "rules/cwtools/*"]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.setuptools-rust.ext-modules]]
target = "hoi4companion._native.hoi4companion_parser"
path = "native/parser/Cargo.toml"
binding = "NoBinding"
cargo-manifest-args = ["--locked"]
debug = false

[[tool.setuptools-rust.ext-modules]]
target = "hoi4companion._native.hoi4companion_observer"
path = "native/observer/Cargo.toml"
binding = "NoBinding"
cargo-manifest-args = ["--locked"]
debug = false

[[tool.setuptools-rust.ext-modules]]
target = "hoi4companion._native.hoi4companion_guide_core"
path = "native/guide-core/Cargo.toml"
binding = "NoBinding"
cargo-manifest-args = ["--locked"]
debug = false

[[tool.setuptools-rust.ext-modules]]
target = "hoi4companion._native.hoi4companion_catalog_core"
path = "native/catalog-core/Cargo.toml"
binding = "NoBinding"
cargo-manifest-args = ["--locked"]
debug = false

[[tool.setuptools-rust.ext-modules]]
target = "hoi4companion._native.hoi4companion_tools"
path = "native/tools/Cargo.toml"
binding = "NoBinding"
cargo-manifest-args = ["--locked"]
debug = false

[[tool.setuptools-rust.ext-modules]]
target = "hoi4companion._native.hoi4companion_storage"
path = "native/storage/Cargo.toml"
binding = "NoBinding"
cargo-manifest-args = ["--locked"]
debug = false

[[tool.setuptools-rust.ext-modules]]
target = "hoi4companion._native.hoi4companion_backend"
path = "native/backend/Cargo.toml"
binding = "NoBinding"
cargo-manifest-args = ["--locked"]
debug = false
