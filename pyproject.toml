[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi4companion"
version = "0.1.0"
description = "Open source National Focus Explorer for Hearts of Iron IV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.3,<13"]
license = "MIT"

[project.scripts]
hoi4companion = "hoi4companion.__main__:main"

[tool.setuptools.package-data]
hoi4companion = ["web/*.html", "web/*.css", "web/*.js", "guides/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
