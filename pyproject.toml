[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.12,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi4companion"
version = "0.1.0"
description = "Open source National Focus Explorer for Hearts of Iron IV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.3,<13", "yt-dlp>=2026.3.17", "imageio-ffmpeg>=0.6,<1"]
license = "MIT"

[project.optional-dependencies]
overlay = ["opencv-python-headless>=4.10,<6"]

[project.scripts]
hoi4companion = "hoi4companion.__main__:main"

[tool.setuptools.package-data]
hoi4companion = ["web/*.html", "web/*.css", "web/*.js", "web/*.d.ts", "guides/*.json", "guide-import-prompt.md", "examples/*.txt", "examples/*.json", "licenses/*.txt", "rules/cwtools/**/*", "rules/cwtools/*"]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.setuptools-rust.ext-modules]]
target = "hoi4companion._native.hoi4companion_parser"
path = "native/parser/Cargo.toml"
binding = "NoBinding"
cargo-manifest-args = ["--locked"]
debug = false
