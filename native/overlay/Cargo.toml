[package]
name = "hoi4companion-overlay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "hoi4-overlay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.8", default-features = false, features = ["png"] }
windows = { version = "=0.61.3", features = [
  "Foundation", "Globalization", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"
] }
