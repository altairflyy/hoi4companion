[package]
name = "hoi4companion-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hoi4-desktop"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tao = { version = "=0.37.2", default-features = false, features = ["rwh_06"] }
wry = { version = "=0.57.2", default-features = false }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1

