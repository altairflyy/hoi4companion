[package]
name = "hoi4companion-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "hoi4companion_tools"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects"] }

[profile.release]
lto = true
codegen-units = 1
