[package]
name = "hoi4companion-catalog-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "hoi4companion_catalog_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
