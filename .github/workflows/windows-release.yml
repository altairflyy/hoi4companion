name: Windows distribution

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Tag caches cannot read caches from previous tags. Seed main so later
    # releases can restore the default-branch caches instead of starting cold.
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'native/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: windows-distribution-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native/cwtools/global.json
      - name: Install build dependencies
        id: toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $versions = "$(rustc -Vv)`n$(dotnet --version)`n$env:ImageOS`n$env:ImageVersion"
          $key = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($versions))).ToLowerInvariant()
          "key=$key" >> $env:GITHUB_OUTPUT
      - name: Cache exact native components
        id: native
        uses: actions/cache@v4
        with:
          path: |
            src/hoi4companion/_native/hoi4-backend.exe
            src/hoi4companion/_native/hoi4-desktop.exe
            src/hoi4companion/_native/hoi4companion_backend.dll
            src/hoi4companion/_native/hoi4companion_parser.dll
            src/hoi4companion/_native/overlay
            src/hoi4companion/_native/cwtools
          # No partial key: Rust embeds the root JSON/Markdown resources too.
          # Always repackage web files and rerun tests, even on an exact hit.
          key: windows-native-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('native/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'rust-toolchain*', 'src/hoi4companion/*.json', 'src/hoi4companion/*.md', 'scripts/build-*.ps1', '.github/workflows/windows-release.yml') }}
      - name: Cache downloaded dependencies
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .local/nuget-packages
          key: windows-dependencies-v1-${{ hashFiles('native/**/Cargo.lock', 'native/cwtools/**/packages.lock.json', 'native/cwtools/Directory.Packages.props', 'native/cwtools/vendor/Directory.Packages.props') }}
          restore-keys: windows-dependencies-v1-
      - name: Cache production compilation
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .local/rust-backend-target
            .local/rust-core-tests-target
          key: windows-production-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('native/**/Cargo.lock') }}-${{ hashFiles('native/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'rust-toolchain*', 'src/hoi4companion/*.json', 'src/hoi4companion/*.md') }}
          restore-keys: windows-production-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('native/**/Cargo.lock') }}-
      - name: Prepare native components and on-demand tools
        shell: pwsh
        run: |
          if ('${{ steps.native.outputs.cache-hit }}' -ne 'true') {
            & scripts/build-parser.ps1
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & scripts/build-cwtools.ps1 -Output src/hoi4companion/_native/cwtools
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          node scripts/prepare-windows-tools.cjs
          exit $LASTEXITCODE
      - name: Build native application
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node -e "if(process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)throw Error('Tag/version mismatch')"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          if ('${{ steps.native.outputs.cache-hit }}' -eq 'true') {
            node scripts/build-native-windows.cjs --skip-native
          } else {
            node scripts/build-native-windows.cjs
          }
          exit $LASTEXITCODE
      - name: Test JavaScript and native HTTP contracts
        shell: pwsh
        run: |
          node scripts/test-web.cjs
          exit $LASTEXITCODE
      - name: Test packaged application
        shell: pwsh
        run: |
          $archive = (Get-ChildItem dist/HOI4Companion-*-native-windows-x64.zip | Select-Object -First 1).FullName
          node scripts/smoke-native-windows.cjs $archive --output dist/windows-smoke-results.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: HOI4Companion-windows-x64
          if-no-files-found: error
          # The distribution is already a ZIP; recompressing wastes CPU.
          compression-level: 0
          path: |
            dist/HOI4Companion-*-native-windows-x64.zip
            dist/HOI4Companion-*-native-windows-x64.zip.sha256
            dist/windows-smoke-results.json
  native-tests:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test toolchain
        id: toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $versions = "$(rustc -Vv)`n$env:ImageOS`n$env:ImageVersion"
          $key = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($versions))).ToLowerInvariant()
          "key=$key" >> $env:GITHUB_OUTPUT
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: windows-rust-dependencies-v1-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: windows-rust-dependencies-v1-
      - name: Cache isolated test compilation
        uses: actions/cache@v4
        with:
          path: |
            .local/rust-ci-backend-tests-target
            .local/rust-ci-core-tests-target
          key: windows-tests-no-lto-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('native/**/Cargo.lock') }}-${{ hashFiles('native/**', 'tests/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'rust-toolchain*', 'src/hoi4companion/*.json', 'src/hoi4companion/*.md', 'scripts/test-native.cjs') }}
          restore-keys: windows-tests-no-lto-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('native/**/Cargo.lock') }}-
      - name: Test all native guide and service cores
        shell: pwsh
        run: |
          node scripts/test-native.cjs --ci
          exit $LASTEXITCODE
  draft-release:
    if: github.ref_type == 'tag'
    needs: [build, native-tests]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HOI4Companion-windows-x64
          path: release
      - name: Prepare reviewable release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = 'Pacchetto Windows x64: estrai tutta la cartella e avvia HOI4 Companion.exe. Non richiede runtime installati separatamente. Build sperimentale non firmata; la lettura live resta limitata alle build HOI4 supportate. Risultati smoke test allegati.'
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Release gia pubblicata: usa una nuova versione.' }
            gh release upload $env:RELEASE_TAG release/* --clobber
          } else {
            gh release create $env:RELEASE_TAG release/* --verify-tag --draft --title "HOI4 Companion $env:RELEASE_TAG - Windows x64" --notes $notes
          }
          exit $LASTEXITCODE
